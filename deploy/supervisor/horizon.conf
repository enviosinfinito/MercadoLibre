; Laravel Horizon — process manager for VPS production (supervisord).
;
; Install:
;   sudo cp deploy/supervisor/horizon.conf /etc/supervisor/conf.d/horizon.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Rules:
;   - One Horizon master per environment (do not run multiple replicas of this program).
;   - APP_ENV=production so config/horizon.php "production" process counts apply.
;   - QUEUE_CONNECTION=redis and Redis must be reachable.
;   - After deploy: php artisan horizon:terminate (supervisord restarts it via autorestart).
; Adjust paths / user to match the server layout.

[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/horizon.log
stopwaitsecs=90
